[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "1.5"
description = "Defensive web security auditing and static code analysis (SAST) CLI for Python web applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sentinel AppSec" }]
keywords = ["security", "sast", "appsec", "static-analysis", "owasp", "cwe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Varethic/Sentinel"
Repository = "https://github.com/Varethic/Sentinel.git"
Issues = "https://github.com/Varethic/Sentinel/issues"
Changelog = "https://github.com/Varethic/Sentinel/releases"
Security = "https://github.com/Varethic/Sentinel/security/policy"

[project.scripts]
sentinel = "src.cli:_main"

[tool.setuptools]
packages = ["src", "src.core", "src.analyzers", "src.reporters", "src.active"]
[tool.setuptools.package-data]
"src" = ["json/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E401", "I001"]
