name: Sentinel Security Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Sentinel SAST & Surface Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Sentinel
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Rules
        run: |
          sentinel rules

      - name: Run Sentinel CI Security Gate & Generate SARIF
        run: |
          sentinel ci src --fail-on high --sarif sentinel.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinel.sarif
        continue-on-error: true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-sarif
          path: sentinel.sarif
